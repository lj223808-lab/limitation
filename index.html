<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>CSS Image Effects Project</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <h1>CSS3 Image Effects</h1>

  <div class="gallery">

    <div class="card butterfly">
      <img src="butterfly.jpg" alt="butterfly">
      <p>Butterfly</p>
    </div>

    <div class="card dinosaur">
      <img src="dinosaur.png" alt="dinosaur">
      <p>Dinosaur</p>
    </div>

    <div class="card field">
      <img src="football_field.jpg" alt="football field">
      <p>Football Field</p>
    </div>

    <div class="card penguins">
      <img src="penguins.jpg" alt="penguins">
      <p>Penguins</p>
    </div>

    <div class="card seagull">
      <img src="seagull.png" alt="seagull">
      <p>Seagull</p>
    </div>

    <div class="card theater">
      <img src="theater_stage.jpg" alt="theater">
      <p>Theater Stage</p>
    </div>

    <div class="card tictac">
      <img src="tic-tac-toe.png" alt="tic tac toe">
      <p>Tic Tac Toe</p>
    </div>

  </div>

</body>
</html>
